name: 钉钉发布通知

on:
  push:
    tags:
      - 'v2.0.*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整 tag 信息）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发送钉钉通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          TAG_BODY=$(git tag -l --format='%(contents)' "${TAG_NAME}")
          export TAG_BODY
          python3 - <<'PYEOF'
import os, hmac, hashlib, base64, time, json, urllib.request, urllib.parse

tag     = os.environ["TAG_NAME"]
repo    = os.environ["REPO"]
webhook = os.environ["DINGTALK_WEBHOOK"]
secret  = os.environ.get("DINGTALK_SECRET", "")
body    = os.environ.get("TAG_BODY", "").strip()

# 构建消息文本
repo_url = f"https://github.com/{repo}"
tag_url  = f"{repo_url}/releases/tag/{tag}"

if body:
    lines = body.splitlines()
    title_line = lines[0] if lines else tag
    rest = "\n".join(lines[1:]).strip()
    # 把【xxx】加粗
    import re
    rest = re.sub(r'【(.+?)】', r'**【\1】**', rest)
    md_text = f"## 🚁 {title_line}\n\n{rest}\n\n---\n[📦 查看 Tag]({tag_url})  |  [📁 仓库]({repo_url})"
    md_title = f"🚁 固件更新 {tag}"
else:
    md_title = f"🚁 固件更新 {tag}"
    md_text  = f"## 🚁 {tag}\n\n（未填写 tag 说明）\n\n[📦 查看 Tag]({tag_url})"

# 签名
ts = str(int(time.time() * 1000))
if secret:
    str_to_sign = f"{ts}\n{secret}"
    sig = base64.b64encode(
        hmac.new(secret.encode(), str_to_sign.encode(), hashlib.sha256).digest()
    ).decode()
    sign = urllib.parse.quote_plus(sig)
    url = f"{webhook}&timestamp={ts}&sign={sign}"
else:
    url = webhook

payload = json.dumps({
    "msgtype": "markdown",
    "markdown": {"title": md_title, "text": md_text},
    "at": {"isAtAll": False}
}, ensure_ascii=False).encode("utf-8")

req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req) as resp:
    result = resp.read().decode()
    print("钉钉返回：", result)
    import sys
    resp_json = json.loads(result)
    if resp_json.get("errcode", 0) != 0:
        print("ERROR: 发送失败", resp_json)
        sys.exit(1)
    print("✅ 钉钉消息发送成功")
PYEOF
