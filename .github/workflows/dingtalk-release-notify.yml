name: 钉钉发布通知

on:
  push:
    tags:
      - 'v2.0.*'
      - 'v3.0.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要通知的 tag（如 v3.0.1）'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整 tag 信息）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取 tag 说明
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          TAG_BODY=$(git cat-file -p "refs/tags/${TAG}" | awk 'BEGIN{found=0} /^$/{if(!found){found=1;next}} found{print}')
          echo "TAG_BODY<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$TAG_BODY" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: 发送钉钉通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
          TAG_BODY: ${{ steps.tag_info.outputs.TAG_BODY }}
        run: python3 .github/scripts/dingtalk_notify.py
