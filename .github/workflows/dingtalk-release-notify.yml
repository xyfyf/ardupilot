name: 钉钉发布通知

on:
  push:
    tags:
      - 'v2.0.*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整 tag 信息）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取 tag 说明
        id: tag_info
        run: |
          TAG_BODY=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          echo "TAG_BODY<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$TAG_BODY" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: 发送钉钉通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_BODY: ${{ steps.tag_info.outputs.TAG_BODY }}
        run: python3 .github/scripts/dingtalk_notify.py
