<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>合肥新桥机场 · 禁飞区</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #172230;
      --line: #2a3a4d;
      --text: #e8eef5;
      --muted: #8fa3b8;
      --inside: #e5534b;
      --accent: #4aa3df;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 18px; margin: 0; font-weight: 650; }
    .sub { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0; }
    .ok {
      background: rgba(229,83,75,.14);
      color: var(--inside);
      border: 1px solid rgba(229,83,75,.35);
      border-radius: 10px;
      padding: 12px;
      font-weight: 650;
      font-size: 14px;
    }
    .card {
      background: #101925;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    code { color: #9fd0f2; font-size: 11px; }
    .coords {
      max-height: 220px;
      overflow: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      color: #c5d4e3;
      white-space: pre;
    }
    #map { height: 100%; width: 100%; background: #1a2430; }
    .legend {
      position: absolute; z-index: 500; right: 12px; bottom: 12px;
      background: rgba(16,25,37,.92); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font-size: 12px;
    }
    .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh; }
      aside { max-height: 45vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside>
    <div>
      <h1>合肥新桥机场禁飞区</h1>
      <p class="sub">数据来源：固件离线包 / 大疆中国限制区（<code>Hefei Xinqiao Airport</code>）</p>
    </div>

    <div class="ok">是 — 已列为多边形禁飞区（2 片）</div>

    <div class="card">
      <h2>索引（与飞控 CSV 一致）</h2>
      <table>
        <thead>
          <tr><th>区号</th><th>中心</th><th>覆盖半径</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><code>140600</code></td>
            <td>32.0275°N<br>116.9248°E</td>
            <td>~14.9 km</td>
          </tr>
          <tr>
            <td><code>140601</code></td>
            <td>31.9492°N<br>117.0285°E</td>
            <td>~14.7 km</td>
          </tr>
        </tbody>
      </table>
      <p class="sub" style="margin-top:10px">父区 <code>1406</code> · 出现在 <code>index.csv</code> / <code>polys.csv</code> / ROMFS 分片中</p>
    </div>

    <div class="card">
      <h2>多边形顶点（经度, 纬度）</h2>
      <div class="coords" id="coordDump"></div>
    </div>
  </aside>

  <div style="position:relative">
    <div id="map"></div>
    <div class="legend">
      <div><span class="swatch" style="background:#e5534b88;border-color:#e5534b"></span>140600 西侧片区</div>
      <div><span class="swatch" style="background:#e6a23c88;border-color:#e6a23c"></span>140601 东侧片区</div>
      <div><span class="swatch" style="background:#4aa3df55;border-color:#4aa3df"></span>机场大致位置</div>
    </div>
  </div>
</div>

<script>
/** 与 sdcard/EFT_nfz/polys.csv、ROMFS_custom/nfz/polys.part3.csv 一致 */
const ZONES = [
  {
    id: 140600,
    label: '西侧片区',
    color: '#e5534b',
    center: [32.0274932, 116.9247896],
    ring: [
      [116.9522599, 32.0644807],
      [116.9172943, 32.1444748],
      [116.8485201, 32.1101177],
      [116.9085194, 32.0434341],
      [116.8916300, 32.0158818],
      [116.8896446, 31.9993691],
      [116.8927661, 31.9829834],
      [116.9190897, 31.9412062],
      [116.9445304, 31.9186182],
      [116.9623128, 31.9117142],
      [117.0010590, 31.9105117],
    ],
  },
  {
    id: 140601,
    label: '东侧片区',
    color: '#e6a23c',
    center: [31.9491667, 117.0285347],
    ring: [
      [117.0360565, 31.8338526],
      [117.1048095, 31.8665502],
      [117.0414805, 31.9349184],
      [117.0586438, 31.9603680],
      [117.0616891, 31.9767640],
      [117.0525988, 32.0087607],
      [117.0342439, 32.0354615],
      [117.0089978, 32.0569963],
      [116.9910861, 32.0637097],
      [116.9522599, 32.0644807],
      [117.0010590, 31.9105117],
    ],
  },
]

const dump = ZONES.map((z) => {
  const lines = z.ring.map((p, i) => `  ${String(i + 1).padStart(2)}  ${p[0].toFixed(7)}, ${p[1].toFixed(7)}`)
  return `#${z.id} ${z.label}\n` + lines.join('\n')
}).join('\n\n')
document.getElementById('coordDump').textContent = dump

const map = L.map('map').setView([31.988, 116.977], 11)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 18,
}).addTo(map)

const bounds = []
for (const z of ZONES) {
  const latlngs = z.ring.map(([lng, lat]) => [lat, lng])
  const poly = L.polygon(latlngs, {
    color: z.color,
    weight: 2,
    fillColor: z.color,
    fillOpacity: 0.28,
  }).addTo(map)
  poly.bindPopup(`<b>Hefei Xinqiao Airport</b><br>区号 ${z.id}（${z.label}）<br>${z.ring.length} 个顶点`)
  bounds.push(...latlngs)
  L.circleMarker(z.center, {
    radius: 5,
    color: z.color,
    fillColor: '#fff',
    fillOpacity: 0.9,
    weight: 2,
  }).addTo(map).bindTooltip(`中心 ${z.id}`)
}

// 跑道/航站楼附近参考点（公开机场坐标，非禁飞边界）
L.circleMarker([31.987, 116.977], {
  radius: 7,
  color: '#4aa3df',
  fillColor: '#4aa3df',
  fillOpacity: 0.85,
  weight: 2,
}).addTo(map).bindPopup('合肥新桥国际机场（参考点）')

map.fitBounds(bounds, { padding: [30, 30] })
</script>
</body>
</html>
